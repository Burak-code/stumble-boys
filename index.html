<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="icon" type="image/x-icon" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stumble Boys - Demo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #00ff88;
            --primary-hover: #00cc6e;
            --bg: #050505;
            --panel: rgba(15, 15, 15, 0.98);
            --text: #ffffff;
            --accent: #333;
        }
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            user-select: none; 
            width: 100vw;
            height: 100vh;
            position: fixed;
        }
        
        .overlay {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100;
        }
        
        .panel {
            background: var(--panel); 
            padding: 30px; 
            border-radius: 20px; 
            border: 1px solid #222;
            width: 85%; 
            max-width: 420px;
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,1);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        h1 { 
            font-size: 2.5rem; 
            font-weight: 900; 
            letter-spacing: -1px; 
            color: var(--text); 
            margin-bottom: 30px; 
            text-align: center; 
        }
        h1 span { color: var(--primary); }

        .menu-buttons { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 100%; 
        }
        
        button {
            padding: 18px; 
            cursor: pointer; 
            background: #151515; 
            border: 1px solid #252525;
            color: white; 
            border-radius: 12px; 
            font-weight: 700; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-size: 0.9rem;
            touch-action: manipulation;
        }
        button:hover, button:active { 
            background: var(--primary); 
            border-color: var(--primary); 
            color: #000; 
            transform: translateY(-3px); 
        }
        button.secondary { 
            background: transparent; 
            border-color: #333; 
            color: #888; 
            margin-top: 10px; 
        }
        button.secondary:hover, button.secondary:active { 
            border-color: #555; 
            color: #fff; 
            transform: none; 
        }

        .sub-panel { 
            display: none; 
            width: 100%; 
            animation: slideUp 0.4s ease-out; 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .setting-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
            text-align: left; 
        }
        .setting-item label { 
            font-size: 0.85rem; 
            color: #999; 
            font-weight: 600; 
            flex: 1;
        }
        
        input[type="text"], input[type="number"], select, input[type="color"] {
            background: #111; 
            border: 1px solid #333; 
            color: white; 
            padding: 10px; 
            border-radius: 8px; 
            width: 140px; 
            max-width: 50%;
            outline: none;
            font-size: 16px; /* iOS zoom'u önlemek için */
        }

        #game-ui {
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            text-align: center; 
            pointer-events: none; 
            display: none; 
            z-index: 50;
            width: 100%;
        }
        #target-box { 
            width: 80px; 
            height: 80px; 
            margin: 10px auto; 
            border: 4px solid white; 
            border-radius: 20px; 
            box-shadow: 0 0 30px rgba(255,255,255,0.2); 
        }
        #timer { 
            font-size: 4rem; 
            font-weight: 900; 
            color: #fff; 
            line-height: 1; 
            text-align: center; 
            width: 100%; 
        }

        .name-tag {
            position: absolute; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 12px;
            font-weight: 800; 
            transform: translate(-50%, -100%); 
            pointer-events: none;
            white-space: nowrap; 
            transition: opacity 0.2s; 
            backdrop-filter: blur(4px);
            text-align: center;
            z-index: 10;
        }

        /* MOBILE CONTROLS */
        #mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            display: none;
            z-index: 90;
            pointer-events: none;
        }
        
        /* Joystick */
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
        }
        
        #joystick-base {
            width: 100%;
            height: 100%;
            background: rgba(30, 30, 30, 0.7);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: absolute;
            backdrop-filter: blur(10px);
        }
        
        #joystick-handle {
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 136, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(255, 255, 255, 0.3);
            transition: background 0.2s;
        }
        
        /* Action Buttons */
        #action-buttons {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: auto;
        }
        
        .action-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            touch-action: manipulation;
            user-select: none;
            transition: all 0.1s;
        }
        
        .action-btn:active {
            background: rgba(0, 255, 136, 0.8);
            transform: scale(0.95);
        }
        
        #push-btn {
            background: rgba(255, 50, 50, 0.7);
            border-color: rgba(255, 100, 100, 0.5);
        }
        
        #push-btn:active {
            background: rgba(255, 80, 80, 0.9);
        }
        
        /* Menu Toggle Button */
        #menu-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            z-index: 95;
            display: none;
            pointer-events: auto;
            touch-action: manipulation;
        }
        
        #menu-toggle:active {
            background: rgba(0, 255, 136, 0.8);
        }

        .char-preview { 
            width: 100%; 
            height: 200px; 
            background: radial-gradient(#222, #000); 
            margin-bottom: 20px; 
            border-radius: 16px; 
            border: 1px solid #222; 
            overflow: hidden; 
        }
        
        #spectate-ui {
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%);
            display: none; 
            z-index: 120; 
            text-align: center;
        }
        #spectate-ui button { 
            padding: 15px 30px; 
            background: rgba(255,0,0,0.2); 
            border-color: #f44; 
            color: #f44; 
        }
        #spectate-ui button:active { 
            background: #f44; 
            color: #000; 
        }

        .hidden { display: none !important; }
        
        .slider-container { width: 100%; margin: 10px 0; }
        .slider-value { 
            display: inline-block; 
            margin-left: 10px; 
            color: var(--primary); 
            font-weight: bold; 
            min-width: 40px;
            text-align: right;
        }
        
        /* Kontrol Ayarı Bileşenleri */
        .control-option {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(30, 30, 30, 0.5);
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .control-option:hover {
            background: rgba(40, 40, 40, 0.7);
            border-color: #555;
        }
        
        .control-option.selected {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--primary);
        }
        
        .control-radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #555;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .control-radio::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            display: none;
        }
        
        .control-option.selected .control-radio::after {
            display: block;
        }
        
        .control-info {
            flex: 1;
        }
        
        .control-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 3px;
        }
        
        .control-desc {
            font-size: 0.8rem;
            color: #aaa;
        }
        
        /* Key Box for PC Controls */
        .key-box {
            background: #1a1a1a; 
            padding: 8px 12px; 
            border-radius: 8px; 
            text-align: center;
            cursor: pointer; 
            border: 1px solid #333; 
            font-size: 0.75rem; 
            font-weight: 800; 
            color: var(--primary);
            min-width: 80px;
            margin-left: 10px;
        }
        .key-box.waiting { 
            border-color: var(--primary); 
            background: rgba(0,255,136,0.1); 
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .panel {
                padding: 25px;
                width: 90%;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            #joystick-container {
                width: 100px;
                height: 100px;
                bottom: 30px;
                left: 30px;
            }
            
            #joystick-handle {
                width: 50px;
                height: 50px;
            }
            
            .action-btn {
                width: 70px;
                height: 70px;
                font-size: 12px;
            }
            
            #action-buttons {
                bottom: 30px;
                right: 30px;
            }
            
            #timer {
                font-size: 3rem;
            }
            
            #target-box {
                width: 70px;
                height: 70px;
            }
        }
        
        @media (max-width: 480px) {
            .panel {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
            
            button {
                padding: 15px;
                font-size: 0.85rem;
            }
            
            #joystick-container {
                width: 90px;
                height: 90px;
                bottom: 25px;
                left: 25px;
            }
            
            #joystick-handle {
                width: 45px;
                height: 45px;
            }
            
            .action-btn {
                width: 65px;
                height: 65px;
                font-size: 11px;
            }
        }
        
        /* Portrait vs Landscape adjustments */
        @media (orientation: landscape) and (max-height: 600px) {
            #mobile-controls {
                height: 45vh;
            }
            
            #timer {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <div id="main-menu" class="overlay">
        <h1>SURV<span>IVAL</span></h1>
        <div class="panel" id="primary-panel">
            <div class="menu-buttons">
                <button onclick="showSubPanel('start-settings')">BAŞLAT</button>
                <button onclick="showSubPanel('editor-menu')">EDİTÖR</button>
                <button onclick="showSubPanel('controls-menu')">KONTROLLER</button>
                <button onclick="showSubPanel('settings-menu')">AYARLAR</button>
            </div>
        </div>

        <div class="panel sub-panel" id="start-settings">
            <h3 style="margin-top:0; letter-spacing:2px">OYUN AYARLARI</h3>
            <div class="setting-item">
                <label>BOT SAYISI</label>
                <input type="number" id="cfg-bot-count" value="8" min="1" max="30">
            </div>
            <div class="setting-item">
                <label>HARİTA BOYUTU</label>
                <select id="cfg-grid-size">
                    <option value="8">KÜÇÜK</option>
                    <option value="10" selected>ORTA</option>
                    <option value="14">BÜYÜK</option>
                </select>
            </div>
            <div class="setting-item">
                <label>İTTİRME GÜCÜ</label>
                <select id="cfg-push">
                    <option value="true">AKTİF</option>
                    <option value="false">DEAKTİF</option>
                </select>
            </div>
            <div class="setting-item">
                <label>TUR SÜRESİ</label>
                <div style="display: flex; align-items: center; width: 100%;">
                    <input type="range" id="cfg-round-time" min="0.1" max="5" step="0.1" value="4.0" style="flex: 1;" oninput="updateTimeValue()">
                    <span class="slider-value" id="time-value">4.0</span> s
                </div>
            </div>
            <button onclick="startGame()" style="width:100%; margin-top:20px; background:var(--primary); color:#000">OYUNA GİR</button>
            <button class="secondary" onclick="showSubPanel('primary-panel')" style="width:100%">İPTAL</button>
        </div>

        <div class="panel sub-panel" id="editor-menu">
            <h3 style="margin-top:0">KARAKTER ÖZELLEŞTİR</h3>
            <div class="menu-buttons">
                <button onclick="enterCharCustomizer()">KARAKTER ÖZELLEŞTİR</button>
                <button class="secondary" onclick="showSubPanel('primary-panel')">GERİ</button>
            </div>
        </div>

        <div class="panel sub-panel" id="char-customizer">
            <div id="preview-container" class="char-preview"></div>
            <div class="setting-item">
                <label>İSİM</label>
                <input type="text" id="p-name" value="OYUNCU" oninput="updatePreview()">
            </div>
            <div class="setting-item">
                <label>RENK</label>
                <input type="color" id="p-color" value="#00ff88" oninput="updatePreview()">
            </div>
            <div class="setting-item">
                <label>AKSESUAR</label>
                <select id="p-hat" onchange="updatePreview()">
                    <option value="none">YOK</option>
                    <option value="tophat">SİLİNDİR</option>
                    <option value="crown">TAC</option>
                    <option value="cones">BOYNUZ</option>
                </select>
            </div>
            <button onclick="saveCharAndReturn()" style="width:100%; background:var(--primary); color:#000">KAYDET</button>
        </div>

        <div class="panel sub-panel" id="controls-menu">
            <h3 style="margin-top:0">KONTROL SEÇENEĞİ</h3>
            <p style="color: #888; font-size: 0.9rem; margin-bottom: 20px; text-align: center;">
                Kullanmak istediğiniz kontrol yöntemini seçin:
            </p>
            
            <div class="control-option" onclick="selectControlType('mobile')" id="mobile-control-option">
                <div class="control-radio"></div>
                <div class="control-info">
                    <div class="control-title">MOBİL KONTROLLER</div>
                    <div class="control-desc">Joystick ve dokunmatik butonlar</div>
                </div>
            </div>
            
            <div class="control-option" onclick="selectControlType('pc')" id="pc-control-option">
                <div class="control-radio"></div>
                <div class="control-info">
                    <div class="control-title">BİLGİSAYAR KONTROLLERİ</div>
                    <div class="control-desc">Klavye tuşları (WASD, Space, vs.)</div>
                </div>
            </div>
            
            <!-- PC Kontrol Ayarları (Sadece PC seçildiğinde gösterilir) -->
            <div id="pc-control-settings" style="display: none; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px;">
                <h4 style="margin-top: 0; margin-bottom: 15px; font-size: 1rem;">TUŞ AYARLARI</h4>
                <div id="key-settings-list" style="max-height: 200px; overflow-y: auto; padding-right: 10px;">
                    <!-- Tuş ayarları buraya dinamik olarak eklenecek -->
                </div>
            </div>
            
            <button onclick="saveControlSettings()" style="width:100%; margin-top:20px; background:var(--primary); color:#000">KAYDET VE OYNA</button>
            <button class="secondary" onclick="showSubPanel('primary-panel')" style="width:100%">İPTAL</button>
        </div>

        <div class="panel sub-panel" id="settings-menu">
            <h3 style="margin-top:0">AYARLAR</h3>
            <div class="setting-item">
                <label>İSİMLERİ GÖSTER</label>
                <select id="cfg-show-names" onchange="updateShowNames()">
                    <option value="true">EVET</option>
                    <option value="false">HAYIR</option>
                </select>
            </div>
            <div class="setting-item">
                <label>FPS GÖSTER</label>
                <select id="cfg-show-fps">
                    <option value="false">HAYIR</option>
                    <option value="true">EVET</option>
                </select>
            </div>
            <div class="setting-item">
                <label>KAMERA YÜKSEKLİĞİ</label>
                <div style="display: flex; align-items: center; width: 100%;">
                    <input type="range" id="cfg-camera-height" min="10" max="50" step="1" value="25" style="flex: 1;" oninput="updateCameraHeightValue()">
                    <span class="slider-value" id="camera-height-value">25</span>
                </div>
            </div>
            <button onclick="saveGameSettings()" style="width:100%; margin-top:20px; background:var(--primary); color:#000">KAYDET</button>
            <button class="secondary" onclick="showSubPanel('primary-panel')" style="width:100%">İPTAL</button>
        </div>
    </div>

    <div id="game-ui">
        <div id="timer">0.0</div>
        <div id="target-box"></div>
        <div id="fps-counter" style="position: absolute; top: 20px; right: 20px; color: #888; font-size: 14px; display: none;"></div>
    </div>

    <div id="spectate-ui">
        <button onclick="location.reload()">OYUNDAN ÇIK</button>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div id="joystick-container">
            <div id="joystick-base"></div>
            <div id="joystick-handle"></div>
        </div>
        <div id="action-buttons">
            <div class="action-btn" id="push-btn">İTTİR</div>
            <div class="action-btn" id="names-btn">İSİMLER</div>
        </div>
    </div>
    
    <div id="menu-toggle">☰</div>

    <div id="name-tags-container"></div>

    <script>
        // SADECE TEMEL RENKLER - AÇIK/KOYU TON YOK
        const COLORS = [
            0xFF0000, // KIRMIZI (Tam kırmızı)
            0x00FF00, // YEŞİL (Tam yeşil)
            0x0000FF, // MAVİ (Tam mavi)
            0xFFFF00, // SARI (Tam sarı)
            0xFFFFFF, // BEYAZ
            0x8800FF, // MOR (Tam mor)
        ];
        
        const COLOR_NAMES = [
            "KIRMIZI", "YEŞİL", "MAVİ", "SARI",
            "BEYAZ", "MOR"
        ];
        
        const TILE_SIZE = 4;
        
        let scene, camera, renderer, clock, previewRenderer, previewScene, previewCamera, previewChar;
        let player, bots = [], tiles = [];
        let gameState = 'menu'; 
        let targetColorIndex = -1;
        let timeLeft = 0;
        let showNames = true;
        let pushEnabled = true;
        let roundTime = 4.0;
        let cameraHeight = 25;
        let showFPS = false;
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 0;

        // Kontrol sistemi
        let controlType = 'auto'; // 'auto', 'mobile', 'pc'
        let isWaitingForKey = null;
        
        // Mobile controls
        let joystickActive = false;
        let joystickX = 0;
        let joystickY = 0;
        let joystickBaseX = 0;
        let joystickBaseY = 0;
        let joystickRadius = 50;
        let isPushing = false;
        let isNamesToggled = false;

        // PC kontrolleri için tuş ayarları
        let userSettings = {
            controlType: 'auto',
            pcKeys: {
                forward: 'KeyW',
                backward: 'KeyS',
                left: 'KeyA',
                right: 'KeyD',
                push: 'Space',
                toggleNames: 'KeyF',
                quit: 'Tab'
            },
            player: { name: 'Oyuncu', color: '#00ff88', hat: 'none' },
            gameSettings: {
                showNames: true,
                showFPS: false,
                cameraHeight: 25
            }
        };

        // Cihaz tespiti
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        function loadSavedData() {
            const saved = localStorage.getItem('survival_pc_mobile_v2');
            if (saved) {
                const parsed = JSON.parse(saved);
                userSettings = {...userSettings, ...parsed};
            }
            
            // Kontrol tipini ayarla
            if (userSettings.controlType === 'auto') {
                controlType = isMobileDevice() ? 'mobile' : 'pc';
            } else {
                controlType = userSettings.controlType;
            }
            
            // Diğer ayarları yükle
            document.getElementById('p-name').value = userSettings.player.name;
            document.getElementById('p-color').value = userSettings.player.color;
            document.getElementById('p-hat').value = userSettings.player.hat;
            
            // Oyun ayarlarını yükle
            showNames = userSettings.gameSettings.showNames;
            showFPS = userSettings.gameSettings.showFPS;
            cameraHeight = userSettings.gameSettings.cameraHeight;
            
            document.getElementById('cfg-show-names').value = showNames;
            document.getElementById('cfg-show-fps').value = showFPS;
            document.getElementById('cfg-camera-height').value = cameraHeight;
            document.getElementById('camera-height-value').textContent = cameraHeight;
            
            // Kontrol seçimini güncelle

        function setupEventListeners() {
            // Klavye olayları (PC kontrolleri için)
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            window.addEventListener('resize', onWindowResize);
            
            // Mobile kontroller için olay dinleyicileri
            if (controlType === 'mobile') {
                setupMobileControls();
            }
            
            // Menü butonu
            document.getElementById('menu-toggle').addEventListener('click', function() {
                if (gameState === 'playing' || gameState === 'spectating') {
                    pauseGame();
                }
            });
            
            // FPS göstergesini güncelle
            if (showFPS) {
                document.getElementById('fps-counter').style.display = 'block';
            }
        }
        
        function setupMobileControls() {
            const joystickHandle = document.getElementById('joystick-handle');
            const joystickContainer = document.getElementById('joystick-container');
            
            // Joystick konumunu al
            const rect = joystickContainer.getBoundingClientRect();
            joystickBaseX = rect.left + rect.width / 2;
            joystickBaseY = rect.top + rect.height / 2;
            joystickRadius = rect.width / 2 - 30;
            
            // Joystick touch olayları
            joystickHandle.addEventListener('touchstart', handleJoystickStart);
            joystickHandle.addEventListener('mousedown', handleJoystickStart);
            
            // İttir butonu
            document.getElementById('push-btn').addEventListener('touchstart', function(e) {
                e.preventDefault();
                isPushing = true;
                if (gameState === 'playing' && pushEnabled && player) {
                    performPush(player);
                }
            });
            
            document.getElementById('push-btn').addEventListener('touchend', function(e) {
                e.preventDefault();
                isPushing = false;
            });
            
            document.getElementById('push-btn').addEventListener('mousedown', function() {
                isPushing = true;
                if (gameState === 'playing' && pushEnabled && player) {
                    performPush(player);
                }
            });
            
            document.getElementById('push-btn').addEventListener('mouseup', function() {
                isPushing = false;
            });
            
            // İsimler butonu
            document.getElementById('names-btn').addEventListener('touchstart', function(e) {
                e.preventDefault();
                toggleNames();
            });
            
            document.getElementById('names-btn').addEventListener('mousedown', function() {
                toggleNames();
            });
            
            // Dokunmatik hareket olayları
            document.addEventListener('touchmove', handleJoystickMove, { passive: false });
            document.addEventListener('mousemove', handleJoystickMove);
            document.addEventListener('touchend', handleJoystickEnd);
            document.addEventListener('mouseup', handleJoystickEnd);
            
            // Uzun basma menüsünü engelle
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
        }
        
        function handleJoystickStart(e) {
            if (controlType !== 'mobile') return;
            
            e.preventDefault();
            joystickActive = true;
            document.getElementById('joystick-handle').style.background = 'rgba(0, 255, 200, 0.9)';
            
            if (e.type === 'touchstart') {
                const touch = e.touches[0];
                handleJoystickMove({ clientX: touch.clientX, clientY: touch.clientY, type: 'touchmove' });
            }
        }
        
        function handleJoystickMove(e) {
            if (!joystickActive || controlType !== 'mobile') return;
            
            e.preventDefault();
            
            let clientX, clientY;
            if (e.type === 'touchmove') {
                if (e.touches.length === 0) return;
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            let dx = clientX - joystickBaseX;
            let dy = clientY - joystickBaseY;
            
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > joystickRadius) {
                dx = (dx / distance) * joystickRadius;
                dy = (dy / distance) * joystickRadius;
            }
            
            joystickX = dx / joystickRadius;
            joystickY = dy / joystickRadius;
            
            document.getElementById('joystick-handle').style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        }
        
        function handleJoystickEnd(e) {
            if (!joystickActive) return;
            
            joystickActive = false;
            joystickX = 0;
            joystickY = 0;
            document.getElementById('joystick-handle').style.background = 'rgba(0, 255, 136, 0.8)';
            document.getElementById('joystick-handle').style.transform = 'translate(-50%, -50%)';
        }
        
        function handleKeyDown(e) {
            if (controlType === 'mobile') return;
            
            // Tuş atama modunda mı?
            if (isWaitingForKey) {
                userSettings.pcKeys[isWaitingForKey] = e.code;
                isWaitingForKey = null;
                initKeySettingsUI();
                return;
            }
            
            // Oyun kontrolleri
            if (e.code === userSettings.pcKeys.quit) {
                if (gameState === 'playing' || gameState === 'spectating') {
                    pauseGame();
                }
            } else if (e.code === userSettings.pcKeys.toggleNames) {
                toggleNames();
            } else if (gameState === 'playing' && e.code === userSettings.pcKeys.push && pushEnabled) {
                performPush(player);
            }
            
            // Hareket tuşlarını kaydet
            keysPressed[e.code] = true;
        }
        
        function handleKeyUp(e) {
            if (controlType === 'mobile') return;
            keysPressed[e.code] = false;
        }
        
        const keysPressed = {};

        function createCharacter(name, color, isPlayer, isBot = false) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.8), new THREE.MeshPhongMaterial({ color: color }));
            body.position.y = 1;
            body.castShadow = true;
            group.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshPhongMaterial({ color: 0xffdbac }));
            head.position.y = 2.2;
            group.add(head);

            const hatType = isPlayer ? userSettings.player.hat : (isBot ? ['none', 'tophat', 'crown', 'cones'][Math.floor(Math.random()*4)] : 'none');
            if (hatType !== 'none') {
                let hat;
                if (hatType === 'tophat') {
                    hat = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.6), new THREE.MeshPhongMaterial({color: 0x111111}));
                    hat.position.y = 2.8;
                } else if (hatType === 'crown') {
                    hat = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1, 8, 16), new THREE.MeshPhongMaterial({color: 0xffd700}));
                    hat.position.y = 2.7; hat.rotation.x = Math.PI/2;
                } else if (hatType === 'cones') {
                    hat = new THREE.Group();
                    const c1 = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4), new THREE.MeshPhongMaterial({color: 0xffffff}));
                    c1.position.set(0.2, 2.8, 0);
                    const c2 = c1.clone(); c2.position.x = -0.2;
                    hat.add(c1, c2);
                }
                group.add(hat);
            }

            const tag = document.createElement('div');
            tag.className = 'name-tag';
            tag.innerText = name;
            tag.style.color = isPlayer ? '#00ff88' : '#ffffff';
            tag.style.background = isPlayer ? 'rgba(0,255,136,0.15)' : 'rgba(0,0,0,0.5)';
            tag.style.border = `1px solid ${isPlayer ? '#00ff88' : '#444'}`;
            document.getElementById('name-tags-container').appendChild(tag);

            group.userData = { 
                name, velocity: new THREE.Vector3(), isDead: false, 
                tagElement: tag, isPlayer, pushCooldown: 0 
            };
            return group;
        }

        function startGame() {
            const botCount = parseInt(document.getElementById('cfg-bot-count').value);
            const gridSize = parseInt(document.getElementById('cfg-grid-size').value);
            pushEnabled = document.getElementById('cfg-push').value === 'true';
            showFPS = document.getElementById('cfg-show-fps').value === 'true';

            gameState = 'playing';
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('menu-toggle').style.display = 'flex';
            
            // FPS göstergesini ayarla
            document.getElementById('fps-counter').style.display = showFPS ? 'block' : 'none';
            
            // Kontrol tipine göre kontrolleri göster/gizle
            if (controlType === 'mobile') {
                document.getElementById('mobile-controls').style.display = 'block';
                
                // Joystick konumunu güncelle
                const joystickContainer = document.getElementById('joystick-container');
                const rect = joystickContainer.getBoundingClientRect();
                joystickBaseX = rect.left + rect.width / 2;
                joystickBaseY = rect.top + rect.height / 2;
                joystickRadius = rect.width / 2 - 30;
            } else {
                document.getElementById('mobile-controls').style.display = 'none';
            }

            // Önceki oyun nesnelerini temizle
            if (tiles.length > 0) {
                tiles.forEach(t => scene.remove(t));
                tiles = [];
            }
            
            if (bots.length > 0) {
                bots.forEach(b => {
                    scene.remove(b);
                    if (b.userData.tagElement && b.userData.tagElement.parentNode) {
                        b.userData.tagElement.parentNode.removeChild(b.userData.tagElement);
                    }
                });
                bots = [];
            }
            
            if (player) {
                scene.remove(player);
                if (player.userData.tagElement && player.userData.tagElement.parentNode) {
                    player.userData.tagElement.parentNode.removeChild(player.userData.tagElement);
                }
            }
            
            document.getElementById('name-tags-container').innerHTML = '';

            const geo = new THREE.BoxGeometry(TILE_SIZE - 0.1, 0.8, TILE_SIZE - 0.1);
            
            // SADECE TEMEL RENKLER - Rastgele dağılım
            for(let i=0; i<gridSize; i++) {
                for(let j=0; j<gridSize; j++) {
                    const cIdx = Math.floor(Math.random() * COLORS.length);
                    const tile = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({color: COLORS[cIdx]}));
                    tile.position.set((i - gridSize/2 + 0.5)*TILE_SIZE, 0, (j - gridSize/2 + 0.5)*TILE_SIZE);
                    tile.userData = { 
                        colorIndex: cIdx, 
                        colorName: COLOR_NAMES[cIdx],
                        initialY: 0 
                    };
                    scene.add(tile);
                    tiles.push(tile);
                }
            }

            player = createCharacter(userSettings.player.name, userSettings.player.color, true);
            scene.add(player);

            const botNames = ["Burak", "Efe", "Can", "Melis", "Sarp", "Derin", "Arda", "Aslı", "Mert", "Selin", "Kaan", "Derya"];
            for(let i=0; i<botCount; i++) {
                const bot = createCharacter(botNames[i%botNames.length] + "_" + (i+1), Math.random()*0xffffff, false, true);
                bot.position.set((Math.random()-0.5)*gridSize*TILE_SIZE, 0, (Math.random()-0.5)*gridSize*TILE_SIZE);
                bots.push(bot);
                scene.add(bot);
            }

            camera.position.set(0, cameraHeight, cameraHeight * 0.8);
            camera.lookAt(0, 0, 0);
            startRound();
        }

        function startRound() {
            targetColorIndex = Math.floor(Math.random() * COLORS.length);
            const targetColorHex = COLORS[targetColorIndex].toString(16).padStart(6, '0');
            document.getElementById('target-box').style.backgroundColor = '#' + targetColorHex;
            document.getElementById('target-box').style.boxShadow = `0 0 30px #${targetColorHex}`;
            
            timeLeft = roundTime;
            tiles.forEach(t => { t.visible = true; t.position.y = 0; });
        }

        function checkElimination() {
            let safeTiles = 0;
            tiles.forEach(t => { 
                if(t.userData.colorIndex !== targetColorIndex) {
                    t.visible = false;
                } else {
                    safeTiles++;
                }
            });
            
            setTimeout(() => { 
                if(gameState !== 'menu') startRound(); 
            }, 2500);
        }

        function performPush(pusher) {
            if (pusher.userData.isDead || pusher.userData.pushCooldown > 0) return;
            const all = [player, ...bots];
            let hitAnything = false;
            all.forEach(target => {
                if (target === pusher || target.userData.isDead) return;
                const dist = pusher.position.distanceTo(target.position);
                if (dist < 3.0) {
                    const dir = new THREE.Vector3().subVectors(target.position, pusher.position).normalize();
                    target.userData.velocity.add(dir.multiplyScalar(40)); 
                    hitAnything = true;
                }
            });
            pusher.userData.pushCooldown = 1.0;
        }

        function updatePhysics(delta) {
            const all = [player, ...bots];
            all.forEach(obj => {
                if(obj.userData.isDead) { 
                    obj.position.y -= 40 * delta; 
                    obj.rotation.x += 5 * delta;
                    if (obj.userData.tagElement) {
                        obj.userData.tagElement.style.opacity = 0; 
                    }
                    return; 
                }
                
                // Sürtünme uygula (kaymayı azaltmak için)
                obj.userData.velocity.multiplyScalar(0.85);
                
                // Kontrol tipine göre hareket
                if(obj.userData.isPlayer) {
                    const acc = 100 * delta;
                    
                    if (controlType === 'mobile') {
                        // Joystick kontrolleri
                        if (joystickActive) {
                            obj.userData.velocity.x += joystickX * acc;
                            obj.userData.velocity.z += joystickY * acc;
                        }
                    } else {
                        // PC klavye kontrolleri
                        if(keysPressed[userSettings.pcKeys.forward]) obj.userData.velocity.z -= acc;
                        if(keysPressed[userSettings.pcKeys.backward]) obj.userData.velocity.z += acc;
                        if(keysPressed[userSettings.pcKeys.left]) obj.userData.velocity.x -= acc;
                        if(keysPressed[userSettings.pcKeys.right]) obj.userData.velocity.x += acc;
                    }
                    
                    // Maksimum hız sınırı (kaymayı önlemek için)
                    const maxSpeed = 15;
                    if (obj.userData.velocity.length() > maxSpeed) {
                        obj.userData.velocity.normalize().multiplyScalar(maxSpeed);
                    }
                    
                    // Aktif hareket yoksa ek sönümleme
                    if ((controlType === 'mobile' && !joystickActive) || 
                        (controlType === 'pc' && !keysPressed[userSettings.pcKeys.forward] && 
                         !keysPressed[userSettings.pcKeys.backward] && 
                         !keysPressed[userSettings.pcKeys.left] && 
                         !keysPressed[userSettings.pcKeys.right])) {
                        obj.userData.velocity.multiplyScalar(0.9);
                    }
                } else {
                    // Bot AI
                    if(targetColorIndex !== -1) {
                        let best = null; 
                        let dMin = Infinity;
                        tiles.forEach(t => {
                            if(t.userData.colorIndex === targetColorIndex) {
                                const d = obj.position.distanceTo(t.position);
                                if(d < dMin) { 
                                    dMin = d; 
                                    best = t; 
                                }
                            }
                        });
                        if(best) {
                            const dir = new THREE.Vector3().subVectors(best.position, obj.position).normalize();
                            obj.userData.velocity.add(dir.multiplyScalar(60*delta));
                            
                            // Bot hız sınırı
                            const botMaxSpeed = 12;
                            if (obj.userData.velocity.length() > botMaxSpeed) {
                                obj.userData.velocity.normalize().multiplyScalar(botMaxSpeed);
                            }
                        }
                    }
                    
                    // Bot itme mantığı
                    if (pushEnabled && obj.userData.pushCooldown <= 0) {
                        const others = all.filter(o => o !== obj && !o.userData.isDead);
                        others.forEach(other => {
                            if (obj.position.distanceTo(other.position) < 2.5) {
                                performPush(obj);
                            }
                        });
                    }
                }
                
                if (obj.userData.pushCooldown > 0) obj.userData.pushCooldown -= delta;

                // Pozisyon güncellemesi
                obj.position.add(obj.userData.velocity.clone().multiplyScalar(delta));

                // Güvenli karede mi kontrol et
                let onFloor = false;
                tiles.forEach(t => {
                    if (t.visible) {
                        const dx = Math.abs(obj.position.x - t.position.x);
                        const dz = Math.abs(obj.position.z - t.position.z);
                        if(dx < TILE_SIZE/2 && dz < TILE_SIZE/2) onFloor = true;
                    }
                });

                // Güvenli karede değilse ve tur bittiyse ele
                if(!onFloor && targetColorIndex === -1) {
                    obj.userData.isDead = true;
                    if(obj.userData.isPlayer) {
                        gameState = 'spectating';
                        document.getElementById('spectate-ui').style.display = 'block';
                    }
                }

                // İsim etiketlerini güncelle
                if (showNames && obj.userData.tagElement) {
                    const vector = obj.position.clone(); 
                    vector.y += 3.8; 
                    vector.project(camera);
                    const x = (vector.x * .5 + .5) * window.innerWidth;
                    const y = (vector.y * -.5 + .5) * window.innerHeight;
                    obj.userData.tagElement.style.left = `${x}px`;
                    obj.userData.tagElement.style.top = `${y}px`;
                    obj.userData.tagElement.style.opacity = 1;
                } else if (obj.userData.tagElement) {
                    obj.userData.tagElement.style.opacity = 0;
                }
            });
        }

        function formatKeyCode(keyCode) {
            // Tuş kodunu daha okunabilir hale getir
            const keyMap = {
                'KeyW': 'W',
                'KeyA': 'A',
                'KeyS': 'S',
                'KeyD': 'D',
                'Space': 'BOŞLUK',
                'KeyF': 'F',
                'Tab': 'TAB',
                'ArrowUp': 'YUKARI',
                'ArrowDown': 'AŞAĞI',
                'ArrowLeft': 'SOL',
                'ArrowRight': 'SAĞ',
                'ShiftLeft': 'SHIFT',
                'ControlLeft': 'CTRL',
                'AltLeft': 'ALT'
            };
            
            return keyMap[keyCode] || keyCode.replace('Key', '').replace('Digit', '');
        }

                document.getElementById('primary-panel').classList.remove('hidden');

                document.getElementById('mobile-controls').style.display = 'none';

        function resumeGame() {
            if (window.gamePausedState) {
                gameState = window.gamePausedState;
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('game-ui').style.display = 'block';
                document.getElementById('menu-toggle').style.display = 'flex';
                
                if (controlType === 'mobile') {
                    document.getElementById('mobile-controls').style.display = 'block';
                }
                
                if (gameState === 'spectating') {
                    document.getElementById('spectate-ui').style.display = 'block';
                }
            }
        }
        
        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            
            if (currentTime >= lastTime + 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                frameCount = 0;
                lastTime = currentTime;
                
                if (showFPS) {
                    document.getElementById('fps-counter').textContent = `${fps} FPS`;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            
            // FPS hesapla
            updateFPS();
            
            if (gameState === 'playing' || gameState === 'spectating') {
                if (targetColorIndex !== -1) {
                    timeLeft -= delta;
                    if(timeLeft <= 0) { 
                        timeLeft = 0; 
                        checkElimination(); 
                        targetColorIndex = -1; 
                    }
                    document.getElementById('timer').innerText = timeLeft.toFixed(1);
                } else {
                    document.getElementById('timer').innerText = "!!!";
                }
                updatePhysics(delta);
            }
            
            if (previewRenderer && previewChar) {
                previewChar.rotation.y += delta;
                previewRenderer.render(previewScene, previewCamera);
            }
            
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Mobile kontroller için joystick konumunu güncelle
            if (controlType === 'mobile' && (gameState === 'playing' || gameState === 'spectating')) {
                const joystickContainer = document.getElementById('joystick-container');
                const rect = joystickContainer.getBoundingClientRect();
                joystickBaseX = rect.left + rect.width / 2;
                joystickBaseY = rect.top + rect.height / 2;
                joystickRadius = rect.width / 2 - 30;
            }
        }

        window.onload = function() {
            updateTimeValue();
            updateCameraHeightValue();
            init();
        };
    </script>
</body>
</html>
